<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- base white -->
  <rect width="256" height="256" fill="#F7F5F0"/>

  <!-- Main frame -->
  <rect x="8" y="8" width="240" height="240" fill="#111111"/>
  <rect x="15" y="15" width="226" height="226" fill="#F7F5F0"/>

  <!-- De Stijl divider: vertical center at x=128, horizontal center at y=128 -->
  <rect x="122" y="15" width="12" height="226" fill="#111111"/>
  <rect x="15" y="122" width="226" height="12" fill="#111111"/>

  <!-- Panel 1 (top-left, yellow): lab flask -->
  <rect x="15" y="15" width="107" height="107" fill="#F8D030"/>
  <g transform="translate(68.5,68.5)" stroke="#111111">
    <!-- flask neck -->
    <line x1="-20" y1="-34" x2="20" y2="-34" stroke-width="6"/>
    <line x1="-20" y1="-34" x2="-20" y2="-12" stroke-width="6"/>
    <line x1="20" y1="-34" x2="20" y2="-12" stroke-width="6"/>
    <!-- flask body -->
    <path d="M-20,-12 L20,-12 L28,16 A32,32 0 0 1 -28,16 Z" fill="none" stroke-width="6"/>
    <!-- liquid -->
    <path d="M-24,20 L24,20 A28,28 0 0 1 -24,20" fill="#E32636" stroke="none"/>
    <!-- liquid top line -->
    <line x1="-23" y1="20" x2="23" y2="20" stroke-width="4"/>
    <!-- level line -->
    <line x1="-27" y1="6" x2="27" y2="6" stroke-width="4"/>
  </g>

  <!-- Panel 2 (top-right, blue): diary pages -->
  <rect x="134" y="15" width="107" height="107" fill="#1D54A6"/>
  <g stroke="#F7F5F0" stroke-width="5" stroke-linecap="square" fill="none">
    <path d="M150 38 L184 48"/>
    <path d="M150 54 L184 64"/>
    <path d="M150 70 L184 80"/>
    <path d="M150 86 L184 96"/>
  </g>
  <circle cx="208" cy="66" r="13" fill="#F8D030" stroke="#111111" stroke-width="5"/>

  <!-- Panel 3 (bottom-left, red): book -->
  <rect x="15" y="134" width="107" height="107" fill="#E32636"/>
  <g stroke="#111111" stroke-width="7" stroke-linecap="square">
    <line x1="26" y1="158" x2="111" y2="158"/>
    <line x1="26" y1="184" x2="111" y2="184"/>
    <line x1="26" y1="210" x2="111" y2="210"/>
  </g>
  <rect x="44" y="150" width="16" height="72" fill="#F8D030"/>
  <rect x="66" y="150" width="16" height="72" fill="#111111"/>

  <!-- Panel 4 (bottom-right, black): E monogram -->
  <rect x="134" y="134" width="107" height="107" fill="#111111"/>
  <g stroke="#F7F5F0" stroke-width="11" stroke-linecap="square" fill="none">
    <path d="M156 156 L226 156"/>
    <path d="M156 187 L226 187"/>
    <path d="M156 218 L226 218"/>
    <path d="M156 156 L156 218"/>
  </g>
</svg>
<title>ExperMate｜小同门</title>
<script>
/* 主题防闪烁：首帧前应用 localStorage 偏好或系统偏好（'dark' | 'light'，无键 = 跟随系统） */
(function () {
  var t = null;
  try { t = localStorage.getItem('exdiary_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>

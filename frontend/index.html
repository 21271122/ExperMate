<!DOCTYPE html>
<html lang="zh-CN" data-expermate-base="/app">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="exdiary-version" content="1.0.0">
<link rel="icon" type="image/png" href="/app/img/favicon.png">
<title>ExperMate｜小同门</title>
<script>
/* 主题防闪烁：首帧前应用 localStorage 偏好或系统偏好（'dark' | 'light'，无键 = 跟随系统） */
(function () {
  var t = null;
  try { t = localStorage.getItem('exdiary_theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') {
    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
